# dsh-image-tools bundle patch: mounts this package's plugin row.
# 被 dsh plugin --profile web add 安装后自动层叠进 web profile 组合。
# 桥接路由不再配置：插件按 settings.yaml 里用户声明的 image 输入动态判定。
- insert:
    - id: image-tools
      name: '@dsh-external/dsh-image-tools'
      config:
        uploadsDir: uploads
        provider: xiaomi
        model: mimo-v2.5
